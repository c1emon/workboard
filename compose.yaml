services:
  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      WORKBOARD_DB_FILE: /data/workboard.sqlite
    ports:
      - "4000:4000"
    volumes:
      - workboard-data:/data

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
      args:
        VITE_API_BASE: ${VITE_API_BASE:-http://localhost:4000}
    depends_on:
      - server
    ports:
      - "8080:80"

volumes:
  workboard-data:
